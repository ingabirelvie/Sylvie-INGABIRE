<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 7: Smart Portfolio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 40px;
            text-align: center;
        }
        h1 { color: #2c3e50; }
        .cards {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }
        .card {
            background: #3498db;
            color: white;
            padding: 30px;
            border-radius: 10px;
            width: 200px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .card h2 { margin: 0 0 10px 0; }
        .card p { margin: 5px 0; opacity: 0.9; }
        .count { font-size: 14px; opacity: 0.8; }
    </style>
</head>
<body>
    <h1>Hi! I'm Sylvie from Kigali</h1>
    <p>Click a card to view that day's project</p>

    <div class="cards">
        <div class="card" onclick="openDay(1)">
            <h2>Day 1</h2>
            <p>HTML Basics</p>
            <p class="count"><span id="count-1">Clicked 0 times</span></p>
        </div>

        <div class="card" onclick="openDay(2)">
            <h2>Day 2</h2>
            <p>CSS Styling</p>
            <p class="count"><span id="count-2">Clicked 0 times</span></p>
        </div>

        <div class="card" onclick="openDay(3)">
            <h2>Day 3</h2>
            <p>Layouts</p>
            <p class="count"><span id="count-3">Clicked 0 times</span></p>
        </div>

        <div class="card" onclick="openDay(4)">
            <h2>Day 4</h2>
            <p>Forms</p>
            <p class="count"><span id="count-4">Clicked 0 times</span></p>
        </div>

        <div class="card" onclick="openDay(5)">
            <h2>Day 5</h2>
            <p>Responsive</p>
            <p class="count"><span id="count-5">Clicked 0 times</span></p>
        </div>
    </div>

    <script>
        // Load saved counts on page load
        for (let i = 1; i <= 5; i++) {
            let savedCount = localStorage.getItem('day' + i) || 0;
            document.getElementById('count-' + i).innerText = 'Clicked ' + savedCount + ' times';
        }

        function openDay(dayNumber) {
            let count = localStorage.getItem('day' + dayNumber) || 0;
            count++;
            localStorage.setItem('day' + dayNumber, count);
            document.getElementById('count-' + dayNumber).innerText = 'Clicked ' + count + ' times';
            
            alert('Opening Day ' + dayNumber + '! Total clicks: ' + count);
            
            setTimeout(function() {
                window.location.href = 'day' + dayNumber + '.html';
            }, 100);
        }
    </script>
</body>
</html>
