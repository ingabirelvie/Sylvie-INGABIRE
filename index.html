<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 6: Interactive Portfolio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 40px;
            text-align: center;
        }
        h1 { color: #2c3e50; margin-bottom: 10px; }
        p { color: #555; margin-bottom: 30px; }
        .cards {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .card {
            background: #3498db;
            color: white;
            padding: 30px;
            border-radius: 10px;
            width: 200px;
            flex: 0 0 200px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .card h2 { margin: 0 0 10px 0; }
        .card p { margin: 5px 0; color: white; opacity: 0.9; }
    </style>
</head>
<body>
    <h1>Hi! I'm Sylvie from Kigali</h1>
    <p>Click a card to view that day's project</p>

    <div class="cards">
        <div class="card" onclick="openDay(1)">
            <h2>Day 1</h2>
            <p>HTML Basics</p>
        </div>
        <div class="card" onclick="openDay(2)">
            <h2>Day 2</h2>
            <p>CSS Styling</p>
        </div>
        <div class="card" onclick="openDay(3)">
            <h2>Day 3</h2>
            <p>Layouts</p>
        </div>
        <div class="card" onclick="openDay(4)">
            <h2>Day 4</h2>
            <p>Forms</p>
        </div>
        <div class="card" onclick="openDay(5)">
            <h2>Day 5</h2>
            <p>Responsive</p>
        </div>
    </div>

    <script>
        function openDay(dayNumber) {
            alert('Opening Day ' + dayNumber + '!');
            window.location.href = 'day' + dayNumber + '.html';
        }
    </script>
</body>
</html>
